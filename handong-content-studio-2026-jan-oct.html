function setThumb(v){const f=$('#fields');f.querySelector('[name=thumb]').value=v;$('#thumbPrev').innerHTML=cover({thumb:v,url:f.querySelector('[name=url]').value,format:f.querySelector('[name=format]').value})}
$('#form').addEventListener('change',e=>{
  if(editing?.type==='publications'&&e.target.name==='content'){let cid=e.target.value;$('#fields select[name="asset"]').innerHTML='<option value="">Không có / bài chữ</option>'+db.media.filter(m=>m.content===cid).map(m=>`<option value="${esc(m.id)}">${esc(m.title)}</option>`).join('')}
  if(/^check\d$/.test(e.target.name)){const n=$('#fields').querySelectorAll('.checks input:checked').length;$('#ckCount').textContent=n+'/'+checkNames.length;$('#ckCount').className='tag '+(n===checkNames.length?'green':'')}
  if(e.target.id==='thumbLink'||(editing?.type==='media'&&e.target.name==='url'))setThumb(e.target.id==='thumbLink'?e.target.value.trim():$('#fields [name=thumb]').value)});
$('#thumbFile').onchange=e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const w=Math.min(360,img.width),hgt=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=hgt;c.getContext('2d').drawImage(img,0,0,w,hgt);URL.revokeObjectURL(u);if($('#thumbLink')){$('#thumbLink').value='';$('#thumbLink').placeholder='Đang dùng ảnh chọn từ máy';setThumb(c.toDataURL('image/jpeg',.72))}};img.onerror=()=>{URL.revokeObjectURL(u);notify('Không đọc được ảnh này (HEIC chưa được hỗ trợ, hãy dùng JPG/PNG).')};img.src=u};
$('#form').addEventListener('submit',e=>{e.preventDefault();let {type,id}=editing,f=new FormData(e.target),o=Object.fromEntries(f.entries());
  if(editing.id){const src=db[editing.type].find(x=>x.id===editing.id);for(const k of ['sourceId','sourceFormat','sourceRow','sourceRows','sourceMonth','sourceSheet','sourceURL','sourcePostLink','sourceWarning','sourceNote','dateEvidence','importedAt','historyOnly'])if(src&&src[k]!==undefined)o[k]=src[k];if(src?.datePrecision==='day'&&o.posted?.length===10)o.datePrecision='day'}if(o.title)o.title=o.title.trim();if(type!=='publications'&&!o.title){notify('Nhập tiêu đề hợp lệ.');return}
  for(let k of ['url','drive'])if(o[k]&&!safeURL(o[k])){notify('Chỉ chấp nhận link http/https hợp lệ.');return}
  if(o.thumb&&!o.thumb.startsWith('data:image/')&&!safeURL(o.thumb)){notify('Link ảnh bìa không hợp lệ.');return}
  if(type==='content'){o.checks=checkNames.map((_,i)=>f.has('check'+i));checkNames.forEach((_,i)=>delete o['check'+i])}
  if(type==='publications'){if(!o.date){notify('Chọn ngày giờ.');return}let m=db.media.find(m=>m.id===o.asset);if(m&&m.approval!=='Đã duyệt'&&!confirm('Thành phẩm chưa được duyệt. Vẫn lưu lịch?'))return;if(o.status==='Đã đăng'&&!o.posted){notify('Điền ngày giờ đăng thực tế.');return}
    if(['Đã lên lịch','Đã đăng'].includes(o.status)){const c=db.content.find(c=>c.id===o.content),miss=checkNames.slice(0,5).filter((_,i)=>!c?.checks?.[i]);if(miss.length&&!confirm('Checklist sẵn sàng xuất bản còn thiếu:\n• '+miss.join('\n• ')+'\n\nVẫn lưu “'+o.status+'”?'))return}}
  if(type==='media'&&id){let old=db.media.find(m=>m.id===id);if(old.content!==o.content&&db.publications.some(p=>p.asset===id)){notify('Thành phẩm đã có lịch đăng. Không thể đổi nội dung liên quan.');return}}
  const prior=id?db[type].find(x=>x.id===id):null;o={...(prior||{}),...o};o.id=id||uid();o.createdAt=prior?.createdAt||(!id?new Date().toISOString():undefined);o.updatedAt=new Date().toISOString();
  if(type==='content'&&o.status==='Đã duyệt'&&!o.approvedAt)o.approvedAt=o.updatedAt;
  if(id)db[type][db[type].findIndex(x=>x.id===id)]=o;else db[type].push(o);

  save('Đã lưu thay đổi');$('#modal').close();render()});

  else if(el.id==='syncBtn'){if(confirm('Đẩy dữ liệu hiện tại lên Google Sheet (ghi đè 4 tab)?\nMuốn kéo dữ liệu từ Sheet về, vào Cài đặt & kết nối.'))pushSheet()}
  else if(el.id==='copyGas'){const t=$('#gasCode').textContent;(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>notify('Đã sao chép mã Apps Script')).catch(()=>{$('#gasBox').select();document.execCommand('copy');notify('Đã sao chép mã Apps Script')})}
  else if(el.id==='restore')restoreBackup();
  else if(d.reportweeks){reportWeeks=Number(d.reportweeks);render()}
  else if(d.measure){reportMeasure=d.measure;render()}
  else if(el.id==='exportCSV')reportCSV();
  else if(el.id==='exportPlanCSV')planCSV();
  else if(el.id==='printReport')window.print();
  else if(d.go)go(d.go,d);
  else if(d.new)openForm(d.new);
  else if(d.edit)openForm(d.edit,d.id);
  else if(d.view){view=d.view;try{localStorage.setItem('hd_view',view)}catch{}render()}
  else if(d.schedule){let m=db.media.find(m=>m.id===d.schedule);openForm('publications',null,{content:m.content,asset:m.id})}
  else if(d.calmode){calMode=d.calmode;render()}
  else if(d.cal){historyMonth='';if(d.cal==='today')cursor=new Date();else{let dir=d.cal==='next'?1:-1;if(calMode==='month'){cursor.setDate(1);cursor.setMonth(cursor.getMonth()+dir)}else cursor.setDate(cursor.getDate()+dir*7)}render()}
  else if(el.id==='export')download();
  else if(el.id==='import')$('#importFile').click();
  else if(el.id==='demo'){if(confirm('Thay dữ liệu hiện tại bằng DEMO? Bản hiện tại được giữ làm bản khôi phục.')){keepBackup();const u=db.ui;db=seed();db.ui=u;storageError='';overwriteOK=true;save('Đã nạp DEMO');render()}}
  else if(el.id==='clear'){if(confirm('Xóa toàn bộ dữ liệu hiện tại để bắt đầu mới? Bản hiện tại được giữ làm bản khôi phục.')){keepBackup();db={version:1,demo:false,campaigns:[],content:[],media:[],publications:[],activity:[],ui:db.ui};storageError='';overwriteOK=true;save('Đã tạo không gian trống');render()}}
  else if(el.id==='theme'){try{localStorage.setItem('hd_theme',document.body.classList.contains('dark')?'light':'dark')}catch{}render()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='campaignFilter'){campaignFilter=t.value;render()}
  else if(t.id==='ownerFilter'){ownerFilter=t.value;render()}
  else if(t.id==='historyMonth'){historyMonth=t.value;if(historyMonth){cursor=new Date(Number(historyMonth.slice(0,4)),Number(historyMonth.slice(5))-1,1);if(calMode!=='list')calMode='month'}else calMode='list';render()}
  else if(t.id==='channelFilter'){chanFilter=t.value;render()}
  else if(t.dataset.stage){const c=db.content.find(c=>c.id===t.dataset.stage);if(c)setStatus(c,t.value)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-card]');if(c)e.dataTransfer.setData('text/plain',c.dataset.card)});
document.addEventListener('dragover',e=>{const l=e.target.closest?.('[data-lane]');if(l){e.preventDefault();l.classList.add('over')}});
document.addEventListener('dragleave',e=>{const l=e.target.closest?.('[data-lane]');if(l&&!l.contains(e.relatedTarget))l.classList.remove('over')});
document.addEventListener('drop',e=>{const l=e.target.closest?.('[data-lane]');if(!l)return;e.preventDefault();l.classList.remove('over');const c=db.content.find(c=>c.id===e.dataTransfer.getData('text/plain')),sts=PHASE[l.dataset.lane];if(c&&sts&&!sts.includes(c.status))setStatus(c,sts[0])});
$('#importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>8e6)throw Error('Tệp quá lớn (tối đa 8 MB)');let x=JSON.parse(await file.text());validate(x);if(confirm('Thay toàn bộ dữ liệu hiện tại bằng dữ liệu từ JSON ('+x.content.length+' nội dung)? Bản hiện tại được giữ làm bản khôi phục.')){keepBackup();db=x;storageError='';overwriteOK=true;save('Đã nhập dữ liệu');render()}}catch(err){notify('Không nhập được: '+err.message)}e.target.value=''};

const TRACKER_SNAPSHOT=JSON.parse(document.getElementById('trackerImport').textContent);
function trackerSummary(){const m=TRACKER_SNAPSHOT.meta;return `<details class="notice" style="margin:14px 0"><summary style="cursor:pointer"><b>Đã nhập ${m.publicationCount} lần đăng · 01–10/2026</b> · ${m.contentCount} nhóm nội dung · xem nguồn và lưu ý</summary><div class="help" style="margin-top:12px">Nguồn: CONTENT_TRACKER, đọc ngày 13/11/2026. Dùng cột Date Posted; không có giờ đăng nên không gán giờ giả. Không tạo lịch quay/dựng hoặc tài sản Drive từ link bài social. Nhóm nội dung theo ID + tiêu đề + định dạng để không gộp sai.<br>${Object.entries(m.byChannel).map(([k,v])=>esc(k)+': '+v).join(' · ')}<br><a href="${esc(m.sourceURL)}" target="_blank" rel="noopener noreferrer">Mở Google Sheet nguồn ↗</a><br>Đây là bản nhập tại thời điểm nêu trên, không phải đồng bộ trực tiếp.</div><div class="tablewrap"><table><thead><tr><th>Tháng</th><th>Lần đăng</th></tr></thead><tbody>${Object.entries(m.monthly).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>${m.warnings.length?`<div class="help" style="margin-top:12px"><b>Cần đối chiếu nguồn:</b>${m.warnings.map(w=>`<div>Dòng ${w.row} · ${esc(w.type)}${w.value&&w.value.length<50?' · '+esc(w.value):''}</div>`).join('')}</div>`:''}</details>`}
function importTrackerSnapshot(){if(storageError)return;const snap=TRACKER_SNAPSHOT,batch=snap.meta.batchId;if((db.importBatches||[]).includes(batch))return;const before=JSON.stringify(db);if(!hadStoredData)db={version:1,demo:false,campaigns:[],content:[],media:[],publications:[],activity:[]};else keepBackup();let added=0;for(const type of TABLES){const ids=new Set(db[type].map(x=>x.id));for(const o of snap.data[type]){if(ids.has(o.id))continue;if(type==='publications'&&db.publications.some(p=>p.channel===o.channel&&p.posted?.slice(0,10)===o.posted&&p.url&&p.url===o.url))continue;db[type].push(o);ids.add(o.id);if(type==='publications')added++}}db.importBatches=[...(db.importBatches||[]),batch];db.importSource=snap.meta;db.activity.unshift({text:'Nhập '+added+' lần đăng từ CONTENT_TRACKER, tháng 1–10/2026',at:new Date().toISOString()});validate(db);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageError='Không lưu được bản nhập trên trình duyệt. Dữ liệu vẫn hiện trong phiên này; hãy xuất JSON.'}}

importTrackerSnapshot();page='calendar';calMode='month';cursor=new Date(2026,9,1);calendarScope='publishing';
if(location.hash){const route=location.hash.replace(/^#\/?/,'');if(navs.some(n=>n[0]===route))page=route}
render();
</script>
</body></html>
