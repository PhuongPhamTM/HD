<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handong Content Hub</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#16243d;--muted:#66758c;--faint:#93a0b4;--line:#e3e8f1;--soft:#f3f6fb;
--brand:#123985;--brandtext:#123985;--brandsoft:#e9effb;--accent:#2f62c9;
--green:#1c7c5f;--greensoft:#e3f4ed;--amber:#96600c;--ambersoft:#fdf0d6;--red:#b93a43;--redsoft:#fce9ea;--violet:#6a4bb0;--violetsoft:#efe9fb}
body.dark{--bg:#0f1826;--card:#18243a;--ink:#e6edf9;--muted:#a3b2c9;--faint:#7d8ea8;--line:#2c3c56;--soft:#1e2c45;
--brand:#2a56b3;--brandtext:#a9c4ff;--brandsoft:#22355a;--accent:#7ea6f5;
--green:#7fd8b8;--greensoft:#1b3d36;--amber:#f0c77c;--ambersoft:#453a22;--red:#ff9aa4;--redsoft:#472a35;--violet:#c3adf5;--violetsoft:#34295a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-size:12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.danger{color:var(--red)}
button.ghost{border-color:transparent;background:transparent;color:var(--brandtext);padding:6px 8px}
button.ghost:hover{background:var(--brandsoft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--brandtext)}
input,select,textarea{border:1px solid var(--line);background:var(--card);padding:8px 10px;border-radius:9px}
h1{font-size:24px;letter-spacing:-.5px;margin:0;font-weight:650}
h2{font-size:14px;margin:0;font-weight:650}
h3{font-size:13px;margin:0;font-weight:600}
.small{font-size:11px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Khung */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;width:236px;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 8px 18px}
.symbol{width:36px;height:36px;border-radius:10px;background:#123985;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800}
.brand strong{font-size:18px;color:var(--brandtext);letter-spacing:-.4px;display:block;line-height:1.1}
.brand small{font-size:9px;letter-spacing:1.8px;color:var(--faint)}
.sidecreate{width:100%;background:var(--brand);color:#fff;border-color:var(--brand);padding:11px 14px;text-align:left;margin-bottom:6px}
.navlabel{font-size:9px;letter-spacing:1.4px;color:var(--faint);margin:16px 10px 6px}
.nav{display:grid;gap:2px}
.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px;display:flex;gap:10px;align-items:center;font-size:12.5px}
.nav button:hover{background:var(--soft)}
.nav button.active{background:var(--brandsoft);color:var(--brandtext);font-weight:600}
.nav button .ic{width:18px;text-align:center}
.navcount{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:var(--ambersoft);color:var(--amber);font-weight:600}
.navcount.red{background:var(--redsoft);color:var(--red)}
.navfooter{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.7}
.dotled{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--faint)}
.dotled.on{background:#2fae84}
.main{grid-column:2;min-width:0}
.topbar{height:58px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.topactions{display:flex;gap:8px;align-items:center}
.workspace{max-width:1500px;margin:auto;padding:22px 28px 48px}
.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap}
.summary{color:var(--muted);margin:5px 0 0;font-size:12.5px}
.summary b{color:var(--ink);font-weight:600}
.summary .r{color:var(--red);font-weight:600}
.summary .a{color:var(--amber);font-weight:600}
.headactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Nhãn, avatar, tiến độ */
.tag{border-radius:6px;padding:2px 7px;font-size:10.5px;display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--muted);white-space:nowrap;font-weight:500}
.tag.green{background:var(--greensoft);color:var(--green)}
.tag.orange{background:var(--ambersoft);color:var(--amber)}
.tag.red{background:var(--redsoft);color:var(--red)}
.tag.blue{background:var(--brandsoft);color:var(--brandtext)}
.tag.violet{background:var(--violetsoft);color:var(--violet)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:700;flex-shrink:0;background:hsl(var(--h) 60% 90%);color:hsl(var(--h) 45% 28%)}
body.dark .av{background:hsl(var(--h) 30% 28%);color:hsl(var(--h) 60% 85%)}
.who{display:inline-flex;gap:7px;align-items:center}
.frac{display:flex;align-items:center;gap:8px;font-size:11px;white-space:nowrap}
.frac b{font-variant-numeric:tabular-nums;font-weight:600}
.bar{flex:1;height:6px;min-width:44px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.g i{background:#2fae84}
.due{white-space:nowrap}
.due.red{color:var(--red);font-weight:600}
.due.orange{color:var(--amber);font-weight:600}
.due small{display:block;color:var(--faint);font-weight:400;font-size:10.5px}

/* Thẻ */
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden}
.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.cardhead p{margin:2px 0 0}
.cardbody{padding:14px 16px}
.count{font-size:11px;background:var(--soft);color:var(--muted);border-radius:9px;padding:1px 7px;margin-left:6px;font-weight:600;font-variant-numeric:tabular-nums}
.count.red{background:var(--redsoft);color:var(--red)}
.count.orange{background:var(--ambersoft);color:var(--amber)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12px}
.notice{background:var(--ambersoft);color:var(--amber);font-size:11.5px;padding:8px 12px;border-radius:9px;margin-bottom:14px}
.help{line-height:1.8;color:var(--muted);font-size:12px}
.help strong,.help b{color:var(--ink)}
.sec{margin-top:18px}
.sectitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}
.sectitle .n{font-size:10px;letter-spacing:1.4px;color:var(--faint);font-weight:600;display:block}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{text-align:left;padding:14px 16px;border-radius:14px;display:grid;gap:2px;border-left:4px solid var(--line)}
.tile .lab{font-size:11.5px;color:var(--muted)}
.tile .big{font-size:28px;font-weight:650;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .go{font-size:11px;color:var(--brandtext)}
.tile.red{border-left-color:var(--red)}.tile.red .big{color:var(--red)}
.tile.orange{border-left-color:#d79a2b}.tile.orange .big{color:var(--amber)}
.tile.ok .big{color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two.wide{grid-template-columns:1.25fr 1fr}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.cardbody.list{padding-top:2px;padding-bottom:2px}
.linkbtn{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:12.5px;line-height:1.45;border-radius:3px}
.linkbtn:hover{color:var(--brandtext);text-decoration:underline}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:11px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.flow button{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:12px 14px;text-align:left;display:grid;gap:1px;position:relative}
.flow button:last-child{border:0}
.flow button:hover{background:var(--soft)}
.flow .st{font-size:10px;color:var(--faint);letter-spacing:.6px}
.flow .nm{font-size:12px;font-weight:600}
.flow .ct{font-size:22px;font-weight:650;color:var(--brandtext);font-variant-numeric:tabular-nums;line-height:1.2}
.flow .sb{font-size:10.5px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:900px}
.wday{border-right:1px solid var(--line);padding:9px 8px 10px;min-height:112px}
.wday:last-child{border:0}
.wday.today{background:var(--brandsoft)}
.wday .d{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.wday.today .d{color:var(--brandtext);font-weight:700}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--brandsoft);color:var(--ink);border-radius:5px;padding:5px 7px;margin-bottom:4px;font-size:11px;line-height:1.35;white-space:normal}
.ev small{display:block;font-size:10px;color:var(--muted)}
.ev.quay{border-color:#d79a2b;background:var(--ambersoft)}
.ev.dung{border-color:#8a6bd6;background:var(--violetsoft)}
.ev.han{border-color:var(--red);background:var(--redsoft)}
.ev.done{border-color:#2fae84;background:var(--greensoft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.camprow{display:grid;grid-template-columns:minmax(180px,1.3fr) 1fr 1fr auto;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.camprow:last-child{border:0}
.camprow .lab{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.thumbrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.act{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.act:last-child{border:0}
.act i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block;transform:translateY(-1px)}
.act time{font-size:10.5px;color:var(--faint);white-space:nowrap}

/* Bộ lọc */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12px;color:var(--muted);border-radius:7px}
.seg button.selected{background:var(--card);color:var(--brandtext);font-weight:600;box-shadow:0 1px 3px #0f1e3c1f}
.seg button b{font-weight:600;margin-left:5px;font-size:10.5px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border-radius:16px;padding:5px 11px;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip b{font-size:10.5px;background:var(--soft);padding:0 6px;border-radius:8px;font-variant-numeric:tabular-nums;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on b{background:#ffffff2e;color:#fff}
.chip.red:not(.on) b{background:var(--redsoft);color:var(--red)}
.chip.zero:not(.on){opacity:.55}

/* Bảng */
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{color:var(--muted);font-size:10.5px;font-weight:600;padding:9px 14px;background:var(--soft);white-space:nowrap;letter-spacing:.3px;position:sticky;top:0}
td{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:var(--soft)}
td.title{white-space:normal;min-width:260px}
.rowtitle{display:flex;gap:10px;align-items:center}
.rowtitle small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.mini{width:46px;height:34px;border-radius:6px;flex-shrink:0;background:var(--brandsoft);display:grid;place-items:center;color:var(--brandtext);font-size:11px;overflow:hidden;position:relative}
.mini img{width:100%;height:100%;object-fit:cover;display:block}

/* Board */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(214px,1fr));gap:10px;overflow:auto;padding-bottom:10px;align-items:start}
.lane{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px;min-height:130px}
.lane.over{outline:2px dashed var(--accent)}
.lanehead{display:flex;justify-content:space-between;align-items:center;margin:2px 3px 2px}
.lanehead b{font-size:12.5px}
.lanesub{font-size:10.5px;color:var(--faint);margin:0 3px 8px}
.ticket{background:var(--card);border:1px solid var(--line);padding:10px 11px;border-radius:10px;margin-bottom:8px;cursor:grab}
.ticket.late{border-left:3px solid var(--red)}
.ticket .camp{font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center;margin-bottom:4px}
.ticket .camp i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.ticket .foot{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ticket .foot .av{margin-left:auto}
.ticket .frac{margin-top:8px}
.ticket select{font-size:11px;width:100%;margin-top:8px;padding:4px 6px}

/* Lưới thẻ */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cards.four{grid-template-columns:repeat(4,1fr)}
.pad{padding:16px}
.cover{aspect-ratio:16/10;background:linear-gradient(130deg,#123985,#3a6aa8);position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ph{font-size:26px;opacity:.55}
.cover .ct{position:absolute;left:8px;bottom:8px;background:#0b1830b8;color:#fff;padding:2px 7px;border-radius:5px;font-size:10px}
.cover.sm{border-radius:9px}
.mediafoot{padding:12px 14px}
.channels{display:flex;flex-wrap:wrap;gap:4px;margin:9px 0 11px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.queues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.qitem{padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.qitem:last-child{margin:0}

/* Lịch */
.scopebar{display:flex;gap:6px;margin-bottom:16px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));min-width:860px}
.dayhead{padding:8px;border-bottom:1px solid var(--line);text-align:center;font-size:10.5px;color:var(--muted);background:var(--soft)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:110px;padding:7px}
.day.today{background:var(--brandsoft)}
.day .date{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}

/* Báo cáo */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric{border-radius:14px;padding:14px 16px;text-align:left}
.metric .big{font-size:26px;font-weight:650;margin:4px 0;font-variant-numeric:tabular-nums}
.metric.selected{background:var(--brand);color:#fff;border-color:var(--brand)}
.metric.selected .small{color:#dbe5fa}
.metric-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.spark{width:86px;height:24px;overflow:visible}
.changechip{font-size:10px;background:var(--greensoft);color:var(--green);padding:2px 6px;border-radius:5px}
.metric.selected .changechip{background:#ffffff26;color:#fff}
.chart-statset{display:flex;gap:22px;text-align:right}
.chart-statset b{display:block;font-size:14px}
.chartsvg{width:100%;height:auto;min-height:170px;display:block}
.chartsvg text{font:10px "Segoe UI",Arial,sans-serif;fill:var(--muted)}
.three{display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:14px}
.report-row{display:grid;grid-template-columns:minmax(90px,1fr) 90px 24px;align-items:center;gap:10px;padding:7px 0;font-size:11.5px}
.stacked{display:flex;height:12px;overflow:hidden;border-radius:6px;margin:0 0 12px;gap:2px}
.legendrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:11.5px}
.legendrow b{margin-left:auto}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.note{font-size:11px;line-height:1.7;color:var(--muted);margin:12px 0 0}

/* Cài đặt */
.settingsfields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.steps{margin:0;padding-left:18px;line-height:1.9}
textarea.code{width:100%;font:11px/1.5 Consolas,monospace;height:150px;white-space:pre;background:var(--soft)}

/* Hộp thoại */
dialog{border:1px solid var(--line);border-radius:16px;width:680px;max-width:95vw;padding:0;box-shadow:0 24px 90px #0c214840;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0c173c77}
.modalhead{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.formbody{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:68vh;overflow:auto}
.field{display:grid;gap:5px;font-size:11.5px;color:var(--muted);align-content:start}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{width:100%;font-size:12.5px;color:var(--ink)}
.field textarea{line-height:1.6}
.checkbox{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;color:var(--ink);font-size:12px;margin-top:8px}
.checks label{display:flex;gap:8px;align-items:center}
.checks input{width:auto;accent-color:#123985}
.linked{background:var(--soft);padding:10px 12px;border-radius:10px;line-height:1.7;color:var(--ink)}
.linked div{font-size:11.5px}
.thumbpick{display:flex;gap:10px;align-items:center}
.thumbpick .cover{width:96px;flex-shrink:0}
.modalfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12305c;color:#fff;padding:10px 18px;border-radius:10px;z-index:20;display:none;font-size:12.5px;max-width:90vw}

@media(max-width:1180px){.tiles{grid-template-columns:repeat(2,1fr)}.two,.two.wide,.queues{grid-template-columns:1fr}.cards,.cards.four{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(3,1fr)}.flow button{border-bottom:1px solid var(--line)}.camprow{grid-template-columns:1fr 1fr}.settingsfields{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:static;width:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 4px 10px}.navlabel,.navfooter,.sidecreate{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.main{grid-column:1}.workspace{padding:16px 12px 40px}.topbar{padding:0 12px;position:static}.crumb{display:none}.cards,.cards.four,.thumbrow{grid-template-columns:1fr 1fr}.formbody,.checks,.settingsfields{grid-template-columns:1fr}.field.full{grid-column:1}.thumbrow{gap:8px}.camprow{grid-template-columns:1fr}h1{font-size:21px}}
@media print{.sidebar,.topbar,.headactions,.notice,button{display:none!important}.shell{display:block}.workspace{padding:0}.card{break-inside:avoid}body{background:#fff}}
</style></head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><div class="symbol" aria-hidden="true">H</div><div><strong>Handong</strong><small>CONTENT HUB</small></div></div>
  <button class="sidecreate" data-new="content">＋ Nội dung mới</button>
  <div class="navlabel">KHÔNG GIAN LÀM VIỆC</div>
  <nav class="nav" id="nav"></nav>
  <div class="navfooter" id="navfooter"></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="crumb"><span id="brandTitle"></span> <span style="margin:0 8px">/</span><b id="crumb"></b></div>

<script type="text/plain" id="gasCode">// Handong Content Hub – cầu nối Google Sheet (dán vào Tiện ích mở rộng > Apps Script của chính file Sheet)
const TABLES = ['campaigns', 'content', 'media', 'publications'];

function doGet() {
  const ss = SpreadsheetApp.getActiveSpreadsheet(), data = {};
  TABLES.forEach(function (t) {
    const sh = ss.getSheetByName(t);
    data[t] = [];
    if (!sh || sh.getLastRow() < 2) return;
    const v = sh.getDataRange().getDisplayValues(), head = v.shift();
    data[t] = v.filter(function (r) { return r[0]; }).map(function (r) {
      const o = {};
      head.forEach(function (k, i) { if (k) o[k] = r[i]; });
      return o;
    });
  });
  return out({ ok: true, data: data });
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const body = JSON.parse(e.postData.contents), ss = SpreadsheetApp.getActiveSpreadsheet();
    TABLES.forEach(function (t) {
      const rows = (body.data && body.data[t]) || [];
      const sh = ss.getSheetByName(t) || ss.insertSheet(t);
      const keys = ['id'];
      rows.forEach(function (r) { Object.keys(r).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); }); });
      const grid = [keys].concat(rows.map(function (r) {
        return keys.map(function (k) {
          const v = r[k];
          return v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v);
        });
      }));
      sh.clearContents();
      sh.getRange(1, 1, grid.length, keys.length).setNumberFormat('@').setValues(grid);
      sh.setFrozenRows(1);
    });
    return out({ ok: true, savedAt: new Date().toISOString() });
  } catch (err) {
    return out({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
</script>

e5fbddfa","content":"ct26_824b3dbc1d76cca5","channel":"Facebook","account":"Handong E\u0026C","date":"2026-01-22","posted":"2026-01-22","status":"Đã đăng","url":"https://www.facebook.com/HandongEnC/posts/pfbid02PGjaku4wMESaWZX2ZhgSDA7G89J48U5TLNNy3zirrFbtnX2VyCNKL3zZCuejUCRNl","caption":"\"🌱 MỘT CỘT MỐC MỚI - MỘT HÀNH TRÌNH MỚI: LỄ KHỞI CÔNG NHÀ MÁY SẢN XUẤT VẢI SEDO - DUNG QUẤT\n\nVào ngày 21/01 vừa qua, Handong E\u0026C đã long trọng tổ chức Lễ Khởi Công Dự Án Nhà Máy Sản Xuất Vải Sedo - Dung Quất, với vai trò Tổng thầu xây dựng, đánh dấu một cột mốc quan trọng trong hành trình hợp tác cùng Sedo Camping.\n\nBuổi lễ vinh dự chào đón sự hiện diện của đại diện Chủ đầu tư Sedo Camping, cùng các cơ quan quản lý, đơn vị tư vấn thiết kế - giám sát, đối tác và Ban Chỉ huy dự án. Sự tham gia của các bên thể hiện tinh thần đồng hành, hợp tác chặt chẽ ngay từ những bước khởi đầu.\n\nNhà máy Sản xuất Vải Sedo - Dung Quất được định hướng là trung tâm sản xuất chiến lược, đóng vai trò quan trọng trong việc:\n🔹 Mở rộng năng lực sản xuất vải\n🔹 Hoàn thiện chuỗi cung ứng từ nguyên liệu đến sản phẩm hoàn chỉnh\n🔹 Đáp ứng các tiêu chuẩn toàn cầu về chất lượng, an toàn và phát triển bền vững\n\nVới dự án này, Dung Quất - Quảng Ngãi tiếp tục khẳng định vị thế là điểm đến của các dự án công nghiệp hiện đại, gắn với phát triển dài hạn và đóng góp cho kinh tế địa phương.\n\n📍 Một khởi đầu mới - nơi những nền móng đầu tiên được đặt cho một hành trình phát triển bền vững phía trước.\n=============\n🌱 A NEW MILESTONE - A NEW JOURNEY:\nGROUNDBREAKING CEREMONY OF THE SEDO FABRIC MANUFACTURING FACTORY - DUNG QUAT\n\nOn January 21, Handong E\u0026C proudly hosted the Groundbreaking Ceremony of the Sedo - Dung Quat Fabric Manufacturing Factory, serving as the General Contractor. The event marked an important milestone in the partnership journey between Handong E\u0026C and Sedo Camping.\n\nThe ceremony was honored by the presence of representatives from Sedo Camping, along with government authorities, design and supervision consultants, project partners, and the project management team. Their participation reflected a strong spirit of collaboration and close coordination from the very first steps of the project.\n\nThe Sedo - Dung Quat Fabric Manufacturing Factory is considered as a strategic production hub, playing a key role in:\n🔹 expanding fabric manufacturing capacity\n🔹 strengthening an integrated supply chain from raw materials to finished products\n🔹 and meeting global standards in quality, safety, and sustainable development.\n\nWith this project, Dung Quat - Quang Ngai continues to reinforce its position as a destination for modern industrial developments, aligned with long-term growth and meaningful contributions to the local economy.\n\n📍 A new beginning - where the first foundations are laid for a sustainable journey ahead.\n=============\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\nHandong E\u0026C\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\nHotline: 0939 669 799\nWebsite: http://www.handongec.co.kr/\nEmail: contact@handongec.co.kr  \n\n#Handong #HandongEC #construction #engineering #factory #Tổngthầuxâydựng #quangngai #sedodungquat #VSIPQuangNgai #PNSChun #groundbeaking #lekhoicong\"\r","hashtags":"","sourceNote":"","sourceId":"PV-002","sourceFormat":"Post (Image)","sourceRow":16,"sourceMonth":"Jan","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02PGjaku4wMESaWZX2ZhgSDA7G89J48U5TLNNy3zirrFbtnX2VyCNKL3zZCuejUCRNl","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_8d13a8137abcc29c","content":"ct26_824b3dbc1d76cca5","channel":"LinkedIn","account":"Handong E\u0026C","date":"2026-01-22","posted":"2026-01-22","status":"Đã đăng","url":"https://www.linkedin.com/company/76254766/admin/post-analyt m both countries.\n \n 🌏 Nearly 200 high-level delegates gathered including the Ministry of Land, Infrastructure and Transport (MOLIT), LH, KIND, KORAIL, and leaders from Vietnam’s Ministry of Construction, united by a shared goal: advancing next-generation urban and infrastructure development, with a key focus on the Dong Anh new urban area.\n \n 🏗️ For Handong E\u0026C, this signing is not just a milestone, it is a reflection of an established position in large-scale infrastructure projects.\n \n 🌆 As new urban landscapes begin to take shape, Handong E\u0026C is not only behind the construction but engaged from the very beginning, helping define how these cities are built.\n =============\n 𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\n Handong E\u0026C\n Address: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\n Hotline: 0939 669 799\n Website: http://www.handongec.co.kr\n Email: contact@handongec.co.kr\n #Handong #HandongEC #construction #engineering #tongthau #tongthauxaydung #buildingtrustbuildingpartnerships #VNR #Vietnamreport #VietnamKorea #VietnamKoreaPartnership #UrbanDevelopment #BuildingTheFuture","hashtags":"","sourceNote":"","sourceId":"PI-001","sourceFormat":"Post (Image)","sourceRow":71,"sourceMonth":"Apr","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02cD1VVhNpvgwAuJDT5pLz6sTfPHWpPqUMKypb2gE2gisSBGK1tcujXupVMWXJz6bPl","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_4037cbfe6f427258","content":"ct26_e044414666a317c6","channel":"Facebook","account":"Handong E\u0026C","date":"2026-03-22","posted":"2026-03-22","status":"Đã đăng","url":"https://www.facebook.com/reel/3077752092432048/","caption":"Mình vẫn outfit \"rực rỡ\" mỗi ngày mà...#^^#\n #HandongEC #handong #construction #engineering #dailyvlog #kysuxaydung ongEnC/posts/pfbid02TjLxg3vMa156gzKRFbmt8QaUSsKk4ZWki1mYPs1uGMCBftNWskDQYhY496MkXgicl","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_b3eb733905296398","content":"ct26_b40247c69f2f709c","channel":"Facebook","account":"Handong E\u0026C","date":"2026-04-27","posted":"2026-04-27","status":"Đã đăng","url":"https://www.facebook.com/reel/1954618698536522/","caption":"Cuốn thế nhợ...😎\n #Handong #HandongEC #construction #engineering #tongthau #tongthauxaydung #buildingtrustbuildingpartnerships #Vietnamreport #ThauXayDung #engineering #constructionsite #VNRTop10 #VNR","hashtags":"","sourceNote":"","sourceId":"I-017","sourceFormat":"Short Video","sourceRow":78,"sourceMonth":"Apr","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/reel/1954618698536522/","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_e0985c2a835e43fc","content":"ct26_fe04d6dc0c8a740c","channel":"Facebook","account":"Handong E\u0026C","date":"2026-04-30","posted":"2026-04-30","status":"Đã đăng","url":"https://www.facebook.com/HandongEnC/posts/pfbid0Jj6y1MKMNnTjvejngg2E5Vfo9wmP7Dv6x4xMJrjt7GP3MfnX6u5URCDsHdaUWLaAl","caption":"⛑️ 🦺 👷 SAFETY DAY - KHÔNG CHỈ LÀ MỘT NGÀY, MÀ LÀ MỘT THÓI QUEN\n \n Giữa nhịp thi công sôi động tại công trường, Handong E\u0026C cùng các đối tác đã tổ chức Safety Day, nơi mọi người cùng dừng lại một chút để nhìn lại điều quan trọng nhất: AN TOÀN.\n \n Không chỉ là kiểm tra, nhắc nhở hay quy trình, Safety Day là lúc mỗi kỹ sư, công nhân cùng nhau:\n  🔍 rà soát rủi ro\n  🗣️ chia sẻ kinh nghiệm\n  🤝 nhắc nhau làm đúng - làm an toàn - làm có trách nhiệm\n 💙 Với Handong, mỗi chiếc mũ bảo hộ không chỉ là trang bị, mà còn là lời nhắc: phía sau mỗi người là một gia đình đang chờ đợi.\n \n Một công trình tốt là công trình hoàn thành đúng tiến độ.\n Nhưng một công trình ý nghĩa là nơi tất cả mọi người đều trở về an toàn mỗi ngày.\n \n 👉 Safety is not a rule. It’s a habit.\n 👉 Đến nơi an toàn - Làm việc an toàn - Về nhà an toàn\n =========\n ⛑️ 🦺 👷 SAFETY DAY – NOT JUST A DAY, BUT A HABIT\n Amid the dynamic pace of construction, Handong E\u0026C and our partners came together for Safety Day, a moment to pause and refocus on what matters most: SAFETY.\n \n More than inspections, reminders, or procedures, Safety Day is when every engineer and worker:\n  🔍 reviews risks\n  🗣️ shares experiences\n  🤝 reminds one another to work right - work safe - work responsibly\n \n 💙 At Handong, every safety helmet is more than just equipment, it’s a reminder that someone is always waiting at home.\n \n A good project is one delivered on schedule.\n A meaningful project is one where everyone returns home safely, every single day.\n \n 👉 Safety is not a rule. It’s a habit.\n 👉 Arrive safe – Work safe – Go home safe.\n =========\n 𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\n Address: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\n Hotline: 0939 669 799\n Website: http://www.handongec.co.kr\n Email: contact@handongec.co.kr\n \n #HandongEC #handong #construction #engineering #constructionlife #SycamoreBinhDuong #sycamoreB14 #BinhDuong #OrchardHeights #safetyday #safetyfirst","hashtags":"","sourceNote":"","sourceId":"PI-003","sourceFormat":"Post (Image)","sourceRow":79,"sourceMonth":"Apr","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid0Jj6y1MKMNnTjvejngg2E5Vfo9wmP7Dv6x4xMJrjt7GP3MfnX6u5URCDsHdaUWLaAl","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_a7a40a56f86e61da","content":"ct26_a3633f1caf8619c5","channel":"Facebook","account":"Handong E\u0026C","date":"2026-04-30  ân gửi đến anh em kỹ sư, công nhân đang ngày đêm bám site. ⛑️👷\r\nGiữa nhịp thi công tất bật, đôi khi một lời động viên, một phần quà nhỏ hay một cái bắt tay cũng đủ tiếp thêm năng lượng cho cả ngày làm việc. 💪\r\n💙 Với Handong, phía sau mỗi chiếc mũ bảo hộ không chỉ là người lao động, mà còn là gia đình, là những người đang chờ họ trở về an toàn mỗi ngày.\r\n👉 Làm hết mình\r\n👉 Làm an toàn\r\n👉 Và luôn về nhà thật vui sau giờ tan ca\r\n=========\r\n🔥 WHEN WE CHOOSE TO CARE FOR EACH OTHER 💙\r\nThis morning at the Oasia SwanBay Project, Handong organized a small appreciation program for engineers and workers as part of the Workers’ Month and Safety Month activities. ⛑️👷\r\nSometimes, a small gift or a simple word of encouragement is enough to give extra energy for the day. 💪\r\n💙 At Handong, behind every safety helmet is a family waiting for their loved ones to come home safely.\r\n👉 Work hard\r\n👉 Work safe\r\n👉 Go home happy\r\n=========\r\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\r\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\r\nHotline: 0939 669 799\r\nWebsite: http://www.handongec.co.kr\r\nEmail: contact@handongec.co.kr","hashtags":"#HandongEC #Handong #OasiaSwanBay #WorkerMonth #SafetyFirst #ConstructionLife #WorkSafeStaySafe #TeamHandong #GoodVibesOnSite #PeopleFirst #ConstructionSafety","sourceNote":"","sourceId":"PI-009","sourceFormat":"Post (Image)","sourceRow":89,"sourceMonth":"May","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"facebook.com/HandongEnC/posts/pfbid02n5AVVgQfaMeVQh7TU8K17jf7Q6zREP2y1J7rETuxCXDgXExRgJaqoPYvyiQeAi19l?__cft__[0]=AZarxZbBvYyGYs9-FGQFnmXZu_S3SqLu1ytLad5o5Hdrmwhr1I5DK6MyQugy3GT85C5MIv_L4frHQOWwXEqsyyWGRJdTnmbqVfqfIS8v7kLTbS0CAUldCPAn_KTM38ne7JhIhK1DJIepqNE7EYsUGRwy\u0026__tn__=%2CO%2CP-R","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-1 c bằng trách nhiệm, kỷ luật và trái tim.✨\r\n🔎📰 Xem thêm bài viết tại: https://thanhnien.vn/trao-hoc-bong-nguyen-thai-binh-tiep...\r\n=============\r\nSOME PROJECTS ARE BUILT TO SERVE.\r\nSOME DREAMS ARE LIFTED TO FLY HIGHER. 💙\r\nOn May 27, representatives of Handong E\u0026C awarded scholarships to outstanding students overcoming difficulties at Binh Son High School, Quang Ngai Province, where Handong is currently constructing the Sedo Dung Quat Fabric Manufacturing Factory. 🏭\r\nFrom the construction site to the classroom, we believe our presence in a local community is not only about building projects, but also about nurturing confidence, motivation, and dreams for the next generation.\r\nThe students’ smiles, bright eyes, and determination inspire the Handong team to keep working with responsibility, discipline, and heart.✨\r\n=============\r\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\r\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\r\nHotline: 0939 669 799\r\nWebsite: http://www.handongec.co.kr/\r\nEmail: contact@handongec.co.kr  ","hashtags":"#Handong #HandongEC #construction #engineering #factory #Tổngthầuxâydựng #quangngai #sedodungquat #VSIPQuangNgai #PNSChun #hocbongnguyenthaibinh #thptbinhson #traohocbong","sourceNote":"","sourceId":"PI-011","sourceFormat":"Post (Image)","sourceRow":111,"sourceMonth":"May","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02T3iRD6e3oKVsHgMBTsSK9ha1BABrp7bUx8ZfFtPk7uZuW6uHiCuGWGVce64VHeJol?__cft__[0]=AZbOiJXVhnLTBJfpUU1YWGLfFri5hmMB305EcCSQCaqu3fvP4sNvInkwQlBMSgA_Dn5wxsJH13AqGnj2KVjZWIKSglXDRa6gMlJNPAlCvtfzZQzqZ_PhGRKa3CLlL5jPVTBT2R5Qajlti-pI8MkTqapGBjEMJr532c3iI1eZlxmSJRKSUHCqov_h1M5VqUyHPpw\u0026__tn__=%2CO%2CP-R","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_cb07d0ea 6RzL1FRP7TizhSfnJmGSy9GATPzPWqBjfYcZPdrzHl?__cft__[0]=AZYrL1RyKO1DJaIsqLmQEZOpzYhD_4moakuQucsYN05REu3kcSpWYsDSSRTyGr4BUXYVKFIa0HM7YbdBh6ZwSZD9rezcWI0Y6gHkpz0Lmthk-dygIXkjuYcIHa92ThACg4KUQMYCETjRUaPL6JsrQ5KGibIomE9wI18O6nR50eDDLw7lrfF2ydo0S8Nkyjj9164\u0026__tn__=%2CO%2CP-R","caption":"Nắng đã có mũ, mưa đã có ô, còn an toàn PCCC thì phải có chuẩn bị từ trước. 💢🧯\r\nNhằm hưởng ứng tinh thần tháng An toàn Vệ sinh Lao động, đội ngũ 𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 tại site 𝗢𝗮𝘀𝗶𝗮 𝗦𝘄𝗮𝗻𝗕𝗮𝘆 đã tham gia buổi tập huấn nghiệp vụ PCCC và cứu hộ cứu nạn, nhằm\r\n▪️nâng cao kỹ năng nhận diện rủi ro, \r\n▪️xử lý tình huống \r\n▪️và phối hợp an toàn khi có sự cố.\r\nKhông chỉ học lý thuyết, anh em công trường còn được thực hành sử dụng thiết bị chữa cháy, phối hợp thoát nạn và phản ứng nhanh trong tình huống khẩn cấp.\r\nVì trên công trường, an toàn không đến từ may mắn.\r\nAn toàn đến từ sự chuẩn bị, luyện tập và hành động đúng lúc. 💪\r\n=========\r\nSunshine needs a helmet, rain needs an umbrella, and fire safety needs preparation before anything happens. 💢🧯\r\nIn response to Occupational Safety and Health Month, the 𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 team at 𝗢𝗮𝘀𝗶𝗮 𝗦𝘄𝗮𝗻𝗕𝗮𝘆 site participated in a fire prevention, firefighting, rescue and emergency response training session to:\r\n▪️ strengthen risk awareness\r\n▪️ improve emergency handling skills\r\n▪️ and enhance safe coordination when incidents occur.\r\nBeyond theory, the site team also practiced using firefighting equipment, evacuation coordination, and quick response in emergency situations.\r\nBecause on-site, safety does not come from luck.\r\nIt comes from preparation, practice, and taking the right action at the right time. 💪\r\n=========\r\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\r\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\r\nHotline: 0939 669 799\r\nWebsite: http://www.handongec.co.kr\r\nEmail: contact@handongec.co.kr","hashtags":"#HandongEC #handong #construction #engineering #kysuxaydung  #swanbay #swanbaydaiphuoc #dongnai #duandongnai #PCCC #antoanlatrenhet #safetyfirst ","sourceNote":"","sourceId":"PI-012","sourceFormat":"Post (Image)","sourceRow":116,"sourceMonth":"May","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02DnEQ9MkgEsTT6x6HFqtAd36RzL1FRP7TizhSfnJmGSy9GATPzPWqBjfYcZPdrzHl?__cft__[0]=AZYrL1RyKO1DJaIsqLmQEZOpzYhD_4moakuQucsYN05REu3kcSpWYsDSSRTyGr4BUXYVKFIa0HM7YbdBh6ZwSZD9rezcWI0Y6gHkpz0Lmthk-dygIXkjuYcIHa92ThACg4KUQMYCETjRUaPL6JsrQ5KGibIomE9wI18O6nR50eDDLw7lrfF2ydo0S8Nkyjj9164\u0026__tn__=%2CO%2CP-R","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_4006dc4ef29cdbc0","content":"ct26_fd101ace1ec675c7","channel":"LinkedIn","account":"Handong E\u0026C","date":"2026-05-29","posted":"2026-05-29","status":"Đã đăng","url":"https://www.linkedin.com/company/76254766/admin/post-analytics/urn:li:activity:7466047074233643008/?lipi=urn%3Ali%3Apage%3Aorganization_admin_admin_analytics_updates%3B05f3b65a-d238-48b2-a767-67c44e831506","caption":"","hashtags":"","sourceNote":"","sourceId":"PI-012","sourceFormat":"Post (Image)","sourceRow":117,"sourceMonth":"May","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.linkedin.com/company/76254766/admin/post-analytics/urn:li:activity:7466047074233643008/?lipi=urn%3Ali%3Apage%3Aorganization_admin_admin_analytics_updates%3B05f3b65a-d238-48b2-a767-67c44e831506","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_da545d7b8f3038a1","content":"ct26_9d9d0f396cabde04","channel":"Facebook","account":"Handong E\u0026C","date":"2026-05-31","posted":"2026-05-31","status":"Đã đăng","url":"https://www.facebook.com/reel/4139566562970589/?__cft_ ,"importedAt":"2026-11-13"},{"id":"pub26_33af8908ccdb9b20","content":"ct26_075325f90f3be9df","channel":"Facebook","account":"Handong E\u0026C","date":"2026-06-03","posted":"2026-06-03","status":"Đã đăng","url":"https://www.facebook.com/reel/2096169850947426/","caption":"Thế cho nó vuông...😎\n#HandongEC #handong #construction #engineering #constructionlife #kysuxaydung #dailyvlog #antoanlaodong #safetyfirst #safetytips #viralvideo #viral_video","hashtags":"","sourceNote":"","sourceId":"I-032","sourceFormat":"Safety Video","sourceRow":123,"sourceMonth":"Jun","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/reel/2096169850947426/","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_f8eeb70901e66a5c","content":"ct26_f5ec87d3876397d0","channel":"Facebook","account":"Handong E\u0026C","date":"2026-06-04","posted":"2026-06-04","status":"Đã đăng","url":"https://www.facebook.com/HandongEnC/posts/pfbid02obs661EhPbXwmdfqPLKUy9Vy37QMcPs3vfsNA8FmRY8x1cNdBc6cAA6XFTnfVisel","caption":"🌍💚 𝗪𝗢𝗥𝗟𝗗 𝗘𝗡𝗩𝗜𝗥𝗢𝗡𝗠𝗘𝗡𝗧 𝗗𝗔𝗬 \n\nKhông cần những điều quá lớn lao để bắt đầu bảo vệ môi trường.\n\n💡 Tắt điện khi không sử dụng\n♻️ Phân loại và tái chế rác thải\n🚲 Ưu tiên các lựa chọn xanh hơn\n🌱 Chung tay giảm phát thải mỗi ngày\n\nMỗi hành động nhỏ hôm nay đều góp phần tạo nên một tương lai xanh hơn cho ngày mai.\n\nToàn cầu chung tay - Hành động vì khí hậu.\n=========\n💡 Turn off lights when not in use\n♻️ Sort and recycle waste properly\n🚲 Choose greener alternatives whenever possible\n🌱 Reduce emissions through everyday actions\n\nEvery small step we take today helps create a greener future for tomorrow.\n\nTogether for the planet. Together for climate action. 💚🌍\n=========\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\n\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\nHotline: 0939 669 799\nWebsite: http://www.handongec.co.kr\nEmail: contact@handongec.co.kr\n\n#HandongEC #Handong #WorldEnvironmentDay #ClimateAction #HandongGreen #Sustainability #ActForClimate #BuiltToBeTrusted #GreenFuture #SmallActionsBigImpact #ngaymoitruongthegioi","hashtags":"","sourceNote":"","sourceId":"PI-013","sourceFormat":"Post (Image)","sourceRow":124,"sourceMonth":"Jun","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02obs661EhPbXwmdfqPLKUy9Vy37QMcPs3vfsNA8FmRY8x1cNdBc6cAA6XFTnfVisel","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_bdc928c64f58417e","content":"ct26_25e4cd7a651e162d","channel":"Facebook","account":"Handong E\u0026C","date":"2026-06-09","posted":"2026-06-09","status":"Đã đăng","url":"https://www.facebook.com/HandongEnC/posts/pfbid02tZdfn2xqeFmBwpjrgktjRFyQ7CMb3zXzhRWQeF979fJocx1h6m2Sq7wSyYWBJRx1l","caption":"🏗️ KHỞI CÔNG DỰ ÁN ĐÔNG Á - PHÚ MỸ\nĐặt nền móng cho năng lực sản xuất công nghiệp thế hệ mới\n\n📆Sáng ngày 09/06/2026, Lễ Khởi công Dự án Đông Á - Phú Mỹ đã chính thức được tổ chức tại Phú Mỹ 3, TP. Hồ Chí Minh, đánh dấu bước khởi đầu cho một trong những dự án công nghiệp trọng điểm của Công ty TNHH Đông Á - Phú Mỹ.\n\nVới công suất 1.200.000 tấn/năm, dự án được định hướng trở thành trung tâm sản xuất các sản phẩm sau thép chất lượng cao, góp phần nâng cao năng lực sản xuất công nghiệp tại Việt Nam.\n\nVới vai trò Tổng thầu thi công, Handong E\u0026C tự hào đồng hành cùng Chủ đầu tư trong hành trình hiện thực hóa một dự án mang ý nghĩa chiến lược đối với sự phát triển của ngành công nghiệp vật liệu Việt Nam.\n\nBuổi lễ không chỉ đánh dấu thời khắc khởi đầu của một công trình mới, mà còn mở ra hành trình xây dựng những giá trị bền vững về năng lực sản xuất, chuỗi cung ứng và tăng trưởng dài hạn.\n\n📍 Mỗi công trình bắt đầu từ những nền móng đầu tiên.\nVà mỗi nền móng vững chắc đều là khởi đầu cho những bước phát triển lớn hơn phía trước.\n=========\n🏗️ GROUNDBREAKING CEREMONY OF THE DONG A – PHU MY PROJECT\nBuilding a strong foundation for industrial growth\n\n📆 On June 9, 2026, the Groundbreaking Ceremony of the Dong A – Phu My Project was held at Phu My 3. This marks an important milestone for Dong A – Phu My One Member Co., Ltd., a member of Ton Dong A.\n\nWith a planned capacity of 1.2 million tons per year, the project will produce high-quality steel products and support the growth of Vietnam’s manufacturing industry.\n\nAs the General Contractor, Handong E\u0026C is honored to work with the Investor to deliver this important project.\n\nThis ceremony is not only the start of construction but also the beginning of a journey toward stronger production, a better supply chain, and sustainable growth.\n\n📍 Every project starts with a strong foundation.\nA strong foundation creates opportunities for future success.\n=========\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\nHotline: 0939 669 799\nWebsite: http://www.handongec.co.kr\nEmail: contact@handongec.co.kr\n\n#HandongEC #Handong #generalcontrustion #Tongthauxaydung #Tongthau #DongAPhuMy #TonDongA #GroundbreakingCeremony #IndustrialConstruction #BuiltToBeTrusted #BuildingTrustBuildingPartnerships","hashtags":"","sourceNote":"","sourceId":"PI-014","sourceFormat":"Post (Image)","sourceRow":125,"sourceMonth":"Jun","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02tZdfn2xqeFmBwpjrgktjRFyQ7CMb3zXzhRWQeF979fJocx1h6m2Sq7wSyYWBJRx1l","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_0a46f7cb0cde7900","content":"ct26_bfd09f28f5b2d415","channel":"Facebook","account":"Handong E\u0026C","date":"2026-06-11","posted":"2026-06-11","status":"Đã đăng","url":"https://www.facebook.com/reel/1540304160819407/","caption":"🏗️ Một cột mốc mới. Một khởi đầu mới.\n\nLễ Khởi công Dự án Đông Á - Phú Mỹ đánh dấu bước khởi đầu cho một hành trình phát triển công nghiệp mới.\n\nKhông chỉ là một cột mốc nghi thức, buổi lễ còn thể hiện cam kết đồng hành giữa Chủ đầu tư, các đối tác và đội ngũ dự án trong việc xây dựng những giá trị dài hạn cho tương lai.\n\nMỗi công trình bắt đầu từ một tầm nhìn.\nVà mỗi thành tựu đều bắt đầu từ một nền móng vững chắc.\n=========\n🏗️ A New Milestone. A New Beginning.\n\nThe Groundbreaking Ceremony of the Dong A - Phu My Project marks the start of a new industrial development journey.\n\nMore than a ceremonial milestone, it represents a shared commitment between the Investor, partners, and project teams toward building long-term value for the future.\n\nEvery project begins with a vision. Every achievement begins with a strong foundation.\n=========\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\n\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\nHotline: 0939 669 799\nWebsite: http://www.handongec.co.kr\nEmail: contact@handongec.co.kr\n\n#HandongEC #Handong #generalcontrustion #Tongthauxaydung #Tongthau #DongAPhuMy #TonDongA #GroundbreakingCeremony #IndustrialConstruction #BuiltToBeTrusted #BuildingTrustBuildingPartnerships","hashtags":"","sourceNote":"","sourceId":"PV-005","sourceFormat":"Post (Video)","sourceRow":126,"sourceMonth":"Jun","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/reel/1540304160819407/","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_a7182750741b09b4","content":"ct26_b6f1f65beecdbed7","channel":"Facebook","account":"Handong E\u0026C","dat PnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/reel/4394324404162591/","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_6592e0a01d0bc627","content":"ct26_7c436e4cc1dff7de","channel":"Facebook","account":"Handong E\u0026C","date":"2026-07-20","posted":"2026-07-20","status":"Đã đăng","url":"https://www.facebook.com/HandongEnC/posts/pfbid02YpHGjgBvNpEmsENd3eNLoAScSq2EjTBXJw9WrLYD8rztG3VMF4n74maCXBxbVe3gl","caption":"\"🏗️ Mỗi công trình trọng điểm là một cam kết dài hạn với cộng đồng.\n\nNgày 18/7 vừa qua, Chủ tịch UBND tỉnh Vĩnh Long cùng lãnh đạo các sở, ngành đã khảo sát tiến độ các công trình, dự án trọng điểm trên địa bàn, trong đó có Dự án Xây dựng Bệnh viện Đa khoa Bến Tre.\n\nLà nhà thầu thi công của dự án, Handong E\u0026C nhận thức rõ vai trò và trách nhiệm của mình trong việc huy động nguồn lực, tổ chức thi công khoa học, đảm bảo an toàn, chất lượng và tiến độ theo kế hoạch.\n\n🏥Bệnh viện Đa khoa Bến Tre là công trình có ý nghĩa quan trọng đối với hệ thống hạ tầng y tế và đời sống người dân địa phương. Vì vậy, mỗi giai đoạn triển khai đều được Handong E\u0026C thực hiện với tinh thần nghiêm túc, chủ động và tập trung cao độ.\n\n🤝Handong E\u0026C sẽ tiếp tục phối hợp cùng Chủ đầu tư, các đơn vị liên quan và đội ngũ tại công trường để đưa dự án về đích đúng mục tiêu, đóng góp vào sự phát triển bền vững của địa phương.\n=========\n🏗️ Every key project is a long-term commitment to the community.\n\nOn July 18, the Chairman of Vinh Long Provincial People’s Committee, together with leaders of provincial departments and agencies, inspected the progress of several key projects in the province, including the Ben Tre General Hospital Construction Project.\n\nAs the contractor, Handong E\u0026C clearly understands its role and responsibility. We focus on preparing resources well, organizing the construction work effectively, and making sure everything is safe, high-quality, and on schedule.\n\n🏥 Ben Tre General Hospital is an important project for local healthcare and the well-being of the community. That is why Handong E\u0026C is carrying out every step of the construction with care, responsibility, and strong commitment.\n\n🤝 Handong E\u0026C will continue to work closely with the client, relevant stakeholders, and our site team to bring the project to completion as planned, contributing to the sustainable development of the local community.\n=========\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\n\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\nHotline: 0939 669 799\nWebsite: http://www.handongec.co.kr\nEmail: contact@handongec.co.kr","hashtags":"#HandongEC #Handong #construction #engineering #BenTreGeneralHospital #BenTreHospital #HaTangYTe #TienDoThiCong #CongTrinhTrongDiem #QuanLyThiCong #AnToanChatLuongTienDo #BuildingTrustBuildingPartnerships\"","sourceNote":"","sourceId":"PI-016","sourceFormat":"Post (Image)","sourceRow":158,"sourceMonth":"Jul","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02YpHGjgBvNpEmsENd3eNLoAScSq2EjTBXJw9WrLYD8rztG3VMF4n74maCXBxbVe3gl","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_11d6adaf8c796080","content":"ct26_9b918964fda16c96","channel":"Facebook","account":"Handong E\u0026C","date":"2026-07-22","posted":"2026-07-22","status":"Đã đăng","url":"https://www.facebook.com/reel/1706207580661848/","caption":"\"Từ chối mọi lời rủ rê khác chỉ để làm việc này..^","hashtags":"#HandongEC #tongthauxaydung #Handong #kysuxaydung #engineering #vanphongvuinhon #visitshandong #nhiemvuhethong #ThauXayDung #handonggreen\"","sourceNote":"","sourceId":"I-044","sourceFormat":"Short Video","sourceRow":159,"sourceMonth":"Jul","sourceSheet":"CONTENT_ 51759ee070","channel":"Facebook","account":"Handong E\u0026C","date":"2026-09-11","posted":"2026-09-11","status":"Đã đăng","url":"https://www.facebook.com/HandongEnC/posts/pfbid02UatztPvxADxGr9TjuGwqMKbkjJ2Y9PMi1wekfGR5ZfMEp4tHup8k5wHpmGXGeUaal","caption":"🏗 Nắng mưa là chuyện công trường,\n❤️Bap Bap ghé đến gửi thương đủ đầy. \n\nMột hoạt động thường niên của Handong, nơi những điều giản dị nhất được gửi trao bằng sự quan tâm chân thành:\n👕 Đồng phục mới cho anh chị em công nhân\n🍱 Những phần cơm trưa được chuẩn bị chu đáo\n📸 Những khoảnh khắc đời thường nhưng thật đáng nhớ tại công trường\n\nBap Bap không chỉ là một bữa cơm, mà là lời cảm ơn gửi đến những con người thầm lặng - nhỏ bé giữa công trường, nhưng làm nên những giá trị không nhỏ chút nào.\n\nCùng nhìn lại những hình ảnh dễ thương, năng lượng và đầy ấm áp trong ngày Bap Bap hôm nay nhé! ✨\n=========\n🏗 Rain or shine, that’s life on site.\n❤️ Bap Bap arrives with care, warmth, and heartfelt appreciation.\n\nAs one of Handong’s annual activities, Bap Bap is where simple gestures are shared with sincere care:\n\n👕 New uniforms for our workers\n🍱 Thoughtfully prepared lunch meals\n📸 Everyday moments that become meaningful memories on site\n\nBap Bap is more than just a meal.\nIt is Handong’s way of saying thank you to the quiet contributors - those who may seem small within a vast construction site, yet create values that are anything but small.\n\nLet’s look back at the lovely, energetic, and heartwarming moments from today’s Bap Bap Day! ✨\n=========\n𝗛𝗮𝗻𝗱𝗼𝗻𝗴 𝗘\u0026𝗖 - 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗧𝗿𝘂𝘀𝘁, 𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗣𝗮𝗿𝘁𝗻𝗲𝗿𝘀𝗵𝗶𝗽𝘀!\n\nAddress: 13-15A Nguyen Thi Huynh, Phu Nhuan Ward, HCMC\nHotline: 0939 669 799\nWebsite: http://www.handongec.co.kr\nEmail: contact@handongec.co.kr","hashtags":"#HandongEC #Handong #tongthauxaydung #ThauXayDung #xaydung #xaydunghanquoc #visitshandong #engineering #kysuxaydung #bapbap #HandongLight #FoodTruck #OasiaSwanbay #Daodaiphuoc #Duandongnai","sourceNote":"","sourceId":"PI-019","sourceFormat":"Post (Image)","sourceRow":214,"sourceMonth":"Sep","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/HandongEnC/posts/pfbid02UatztPvxADxGr9TjuGwqMKbkjJ2Y9PMi1wekfGR5ZfMEp4tHup8k5wHpmGXGeUaal","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_942720a4ed7ebbfb","content":"ct26_f1a1a69acd0ee3fe","channel":"Facebook","account":"Handong E\u0026C","date":"2026-09-15","posted":"2026-09-15","status":"Đã đăng","url":"https://www.facebook.com/reel/1381731483561657/","caption":"Gói yêu thương - Trao niềm vui. ❤️🎁","hashtags":"#HandongEC #Handong #tongthauxaydung #ThauXayDung #xaydung #xaydunghanquoc #visitshandong #engineering #kysuxaydung #bapbap #HandongLight #FoodTruck #OasiaSwanbay #Daodaiphuoc #Duandongnai","sourceNote":"","sourceId":"I-059","sourceFormat":"Short Video","sourceRow":215,"sourceMonth":"Sep","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_yOSZc/edit#gid=136676289","sourcePostLink":"https://www.facebook.com/reel/1381731483561657/","datePrecision":"day","dateEvidence":"Date Posted","scheduleUnknown":true,"importedAt":"2026-11-13"},{"id":"pub26_10210190c7466fa1","content":"ct26_a02a3e8686dfc870","channel":"Facebook","account":"Handong E\u0026C","date":"2026-09-17","posted":"2026-09-17","status":"Đã đăng","url":"https://www.facebook.com/reel/1067784992796807/","caption":"Có điểm nào chưa ổn trong tủ điện này? 👀","hashtags":"#HandongEC #Handong #tongthauxaydung #ThauXayDung #xaydung #xaydunghanquoc #visitshandong #engineering #kysuxaydung #xuhuongtiktok #learnontiktok","sourceNote":"","sourceId":"I-060","sourceFormat":"Safety Video","sourceRow":216,"sourceMonth":"Sep","sourceSheet":"CONTENT_TRACKER","sourceURL":"https://docs.google.com/spreadsheets/d/1EUwA-mSPnUTCZqCHCNhBncOtYw4YFqSnFEyAB_   for(const c of x.content){if(typeof c.title!=='string'||!stages.includes(c.status)||!Array.isArray(c.checks)||c.checks.length!==6||(c.campaign&&!ids.campaigns.has(c.campaign)))throw Error('Nội dung không hợp lệ: '+(c.title||c.id))}
  for(const m of x.media)if(typeof m.title!=='string'||!ids.content.has(m.content))throw Error('Thành phẩm không hợp lệ: '+(m.title||m.id));
  for(const p of x.publications)if(!ids.content.has(p.content)||(p.asset&&!x.media.some(m=>m.id===p.asset&&m.content===p.content))||!channels.includes(p.channel)||!pubstates.includes(p.status)||!p.date||!parseVN(p.date))throw Error('Lịch đăng không hợp lệ: '+p.id);
}

const cname=id=>db.content.find(c=>c.id===id)?.title||'—',campname=id=>db.campaigns.find(c=>c.id===id)?.title||'Nội dung thường xuyên';
const originalFmt=(v,time=false)=>v&&parseVN(v)?parseVN(v).toLocaleString('vi-VN',time?{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}:{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const fmt=(v,time=false)=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?originalFmt(v,false)+(time?' · chưa có giờ':''):originalFmt(v,time);
const dm=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
function safeURL(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}}
function overdue(c){return !!c.due&&c.due<localDate()&&!['Đã duyệt','Đã xuất bản','Hủy','Tạm dừng'].includes(c.status)}

function phaseOf(c){return PHASES.find(p=>p[1].includes(c.status))?.[0]||c.status}
function monday(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekDays(d=new Date()){let s=monday(d);return Array.from({length:7},(_,i)=>{let x=new Date(s);x.setDate(x.getDate()+i);return localDate(x)})}
function pubsInDays(days){return db.publications.filter(p=>p.status!=='Hủy'&&days.includes(p.date.slice(0,10)))}
function stats(camp){let cs=db.content.filter(c=>(!camp||c.campaign===camp)&&c.status!=='Hủy'),ps=db.publications.filter(p=>(!camp||cs.some(c=>c.id===p.content))&&p.status!=='Hủy');return {cs,ps,done:cs.filter(c=>c.status==='Đã duyệt').length,posted:ps.filter(p=>p.status==='Đã đăng').length,late:cs.filter(overdue).length}}

function matchContent(c,f){return !f||(f==='Quá hạn'?overdue(c):PHASE[f]?PHASE[f].includes(c.status):c.status===f)}

function dayDiff(s){return Math.round((parseVN(s)-parseVN(localDate()))/864e5)}

function relTime(iso){const d=new Date(iso),m=Math.round((Date.now()-d)/6e4);if(!Number.isFinite(m))return '';return m<1?'vừa xong':m<60?m+' phút trước':m<1440?Math.round(m/60)+' giờ trước':m<2880?'hôm qua':fmt(iso,true)}

function initials(n){n=(n||'').trim();if(!n)return '?';const w=n.split(/\s+/);return (w.length>1?w[0][0]+w[w.length-1][0]:n.slice(0,2)).toUpperCase()}
function avatar(n){let h=0;for(const ch of n||'')h=(h*31+ch.codePointAt(0))%360;return `<span class="av" style="--h:${h}" title="${esc(n||'Chưa phân công')}">${esc(initials(n))}</span>`}
function frac(a,b,label='',g=false){return `<div class="frac">${label?`<span class="small">${label}</span>`:''}<span class="bar ${g?'g':''}"><i style="width:${b?Math.round(a/b*100):0}%"></i></span><b>${a}/${b}</b></div>`}
function dueCell(c){if(!c.due)return '<span class="small">Chưa đặt hạn</span>';if(['Đã duyệt','Hủy','Tạm dừng'].includes(c.status))return `<span class="due">${dm(c.due)}<small>${esc(c.status==='Đã duyệt'?'đã xong':c.status.toLowerCase())}</small></span>`;const n=dayDiff(c.due);return `<span class="due ${n<0?'red':n<=1?'orange':''}">${rel(c.due)}<small>${dm(c.due)}</small></span>`}
function editBtn(type,id,label='Chi tiết'){return `<button class="ghost" data-edit="${type}" data-id="${esc(id)}">${label} ↗</button>`}

function driveId(u){u=String(u||'');if(/\/folders\//.test(u))return '';const m=u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/);return m&&/google\.com/.test(u)?m[1]:''}
function thumbSrc(m){if(!m)return '';const t=m.thumb||'';if(t.startsWith('data:image/'))return t;const id=driveId(t)||(!t&&driveId(m.url));return id?'https://drive.google.com/thumbnail?id='+id+'&sz=w640':safeURL(t)}

const reportColors=['#2f62c9','#d98267','#d0a53a','#8794ab','#5fa58c','#a97a97','#4d98a6','#8d7cb8'];
function reportData(){let now=new Date(),today=vnDay(now),dow=new Date(today+'T12:00:00Z').getUTCDay(),thisMonday=dayAdd(today,-((dow+6)%7)),from=dayAdd(thisMonday,-7*(reportWeeks-1)),previousFrom=dayAdd(from,-7*reportWeeks),previousTo=dayAdd(today,-7*reportWeeks),days=Array.from({length:reportWeeks},(_,i)=>dayAdd(from,i*7));let events={planned:[],posted:[],opened:[],approved:[]};db.publications.filter(p=>p.status!=='Hủy').forEach(p=>{let d=parseVN(p.date);if(d&&!p.scheduleUnknown)events.planned.push({date:d,item:p});if(p.status==='Đã đăng'){let a=parseVN(p.posted);if(a)events.posted.push({date:a,item:p})}});db.content.filter(c=>c.status!=='Hủy').forEach(c=>{let d=parseVN(c.createdAt);if(d)events.opened.push({date:d,item:c});let a=parseVN(c.approvedAt);if(a)events.approved.push({date:a,item:c})});let inRange=(e,a,b)=>{let day=vnDay(e.date);return day>=a&&day<=b};let measures={};for(const k of Object.keys(events)){let current=events[k].filter(e=>inRange(e,from,today)),previous=events[k].filter(e=>inRange(e,previousFrom,previousTo));let values=days.map(d=>current.filter(e=>{let day=vnDay(e.date);return day>=d&&day<dayAdd(d,7)}).length);measures[k]={current,previous,values,total:current.length,prev:previous.length}}return {today,thisMonday,from,days,measures}}
function delta(t){if(!t.prev)return t.total?'Chưa có kỳ gốc':'Không đổi';let n=Math.round((t.total-t.prev)/t.prev*100);return (n>0?'↑ ':n<0?'↓ ':'')+Math.abs(n)+'%'}
function sparkline(v,selected){let max=Math.max(1,...v),pts=v.map((n,i)=>`${i*85/Math.max(1,v.length-1)},${23-n/max*19}`).join(' ');return `<svg class="spark" viewBox="0 0 90 26" aria-hidden="true"><polygon points="0,26 ${pts} 85,26" fill="${selected?'#ffffff24':'#2f62c918'}"/><polyline points="${pts}" fill="none" stroke="${selected?'#dbe5fa':'#2f62c9'}" stroke-width="1.8"/></svg>`}
function trendSVG(data){let v=data.measures[reportMeasure].values,max=Math.max(2,...v),top=Math.ceil(max/4)*4,w=980,h=225,left=35,right=15,bottom=35,plotW=w-left-right,plotH=h-15-bottom;let pts=v.map((n,i)=>[left+i*plotW/Math.max(1,v.length-1),h-bottom-n/top*plotH]);let line=pts.map(p=>p.join(',')).join(' ');return `<svg class="chartsvg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ theo tuần; bảng số liệu ở phía dưới"><defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2f62c9" stop-opacity=".25"/><stop offset="100%" stop-color="#2f62c9" stop-opacity=".01"/></linearGradient></defs>${Array.from({length:5},(_,i)=>{let n=top-i*top/4,y=15+i*plotH/4;return `<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${left-10}" y="${y+4}" text-anchor="end">${n}</text>`}).join('')}<polygon points="${left},${h-bottom} ${line} ${w-right},${h-bottom}" fill="url(#trendFill)"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"><title>Tuần ${data.days[i]}: ${v[i]}</title></circle><text x="${x}" y="${h-11}" text-anchor="${i===0?'start':i===v.length-1?'end':'middle'}">${dm(data.days[i])}</text>`).join('')}</svg>`}
function reportsPage(){let d=reportData(),defs=[['posted','Đã xuất bản','lần đăng'],['planned','Kế hoạch đăng','lần đăng'],['opened','Nội dung mới','nội dung'],['approved','Đã duyệt','lượt duyệt đầu']],active=defs.find(x=>x[0]===reportMeasure),t=d.measures[reportMeasure],s=stats(),currentWeek=t.values.at(-1)||0;
  let open=db.content.filter(c=>!['Đã duyệt','Đã xuất bản','Hủy'].includes(c.status)),groups=db.campaigns.map(c=>({title:c.title,n:open.filter(x=>x.campaign===c.id).length}));let standalone=open.filter(c=>!c.campaign).length;if(standalone)groups.push({title:'Nội dung thường xuyên',n:standalone});groups.sort((a,b)=>b.n-a.n);
  let owners=[...new Set(db.content.map(c=>c.owner||'Chưa phân công'))].map(name=>({name,n:d.measures.approved.current.filter(e=>vnDay(e.date)>=d.thisMonday&&(e.item.owner||'Chưa phân công')===name).length})).sort((a,b)=>b.n-a.n);
  let statusGroups=stages.filter(x=>x!=='Hủy').map((x,i)=>({name:x,n:open.filter(c=>c.status===x).length,color:reportColors[i%reportColors.length]})).filter(x=>x.n);
  return head('Báo cáo',`${fmt(d.from)} – ${fmt(d.today)} · ${reportWeeks} tuần gần đây · tuần hiện tại tính đến hôm nay`,`<div class="seg"><button data-reportweeks="6" class="${reportWeeks===6?'selected':''}">6 tuần</button><button data-reportweeks="12" class="${reportWeeks===12?'selected':''}">12 tuần</button></div><button id="exportCSV">↓ Xuất CSV</button><button id="printReport">In / PDF</button>`)+
  `<div class="metrics">${defs.map(([k,label,unit])=>{let q=d.measures[k];return `<button class="metric ${k===reportMeasure?'selected':''}" data-measure="${k}" aria-pressed="${k===reportMeasure}"><span class="small">${label}</span><div class="big">${q.total}</div><div class="metric-bottom"><span class="changechip">${delta(q)}</span>${sparkline(q.values,k===reportMeasure)}</div><div class="small" style="margin-top:6px">${unit} · so với kỳ trước</div></button>`}).join('')}</div>
  <section class="card" style="margin-bottom:14px"><div class="cardhead"><div><h2>${active[1]} · theo tuần</h2><p class="small">${active[2]} trong kỳ; không tính bản ghi đã hủy</p></div><div class="chart-statset"><div><span class="small">Tuần này</span><b>${currentWeek}</b></div><div><span class="small">TB / tuần</span><b>${(t.total/reportWeeks).toLocaleString('vi-VN',{maximumFractionDigits:1})}</b></div><div><span class="small">So với kỳ trước</span><b>${delta(t)}</b></div></div></div><div style="padding:6px 14px 10px">${trendSVG(d)}</div></section>
  <div class="three"><section class="card"><div class="cardhead"><div><h2>Đầu việc theo campaign</h2><p class="small">Chưa duyệt · trạng thái hiện tại</p></div></div><div class="cardbody">${groups.map((g,i)=>`<div class="report-row"><span>${esc(g.title)}</span><span class="bar"><i style="width:${g.n/Math.max(1,...groups.map(x=>x.n))*100}%;background:${reportColors[i%reportColors.length]}"></i></span><b>${g.n}</b></div>`).join('')||'<div class="empty">Chưa có campaign.</div>'}<p class="note">${open.length} nội dung chưa duyệt · ${db.content.filter(overdue).length} quá hạn. Bao gồm nội dung tạm dừng.</p></div></section>
  <section class="card"><div class="cardhead"><div><h2>Đã duyệt tuần này</h2><p class="small">Theo người phụ trách · từ thứ Hai</p></div></div><div class="cardbody list">${owners.map(o=>`<div class="row"><span class="who">${avatar(o.name)}${esc(o.name)}</span><b class="num">${o.n}</b></div>`).join('')||'<div class="empty">Chưa có dữ liệu.</div>'}<p class="note">Chỉ tính ngày duyệt đầu tiên. Không phải đánh giá năng suất cá nhân.</p></div></section>
  <section class="card"><div class="cardhead"><div><h2>Khối lượng đang ở đâu?</h2><p class="small">Nội dung chưa duyệt theo trạng thái</p></div></div><div class="cardbody"><div class="stacked">${statusGroups.map(g=>`<span style="flex:${g.n};background:${g.color}" title="${esc(g.name)}: ${g.n}"></span>`).join('')}</div>${statusGroups.map(g=>`<div class="legendrow"><i class="dot" style="background:${g.color}"></i><span>${esc(g.name)}</span><b>${g.n}</b></div>`).join('')||'<p class="small">Không còn nội dung chưa duyệt.</p>'}</div></section></div>
  <div class="two sec"><section class="card"><div class="cardhead"><h2>Hoàn thành kế hoạch · hiện tại</h2></div><div class="cardbody">${frac(s.done,s.cs.length,'Sản xuất — đã duyệt')}<div style="height:10px"></div>${frac(s.posted,s.ps.length,'Xuất bản — đã đăng',true)}<p class="note">Toàn bộ dữ liệu, không áp dụng bộ lọc 6/12 tuần. Mẫu số không tính mục đã hủy.</p></div></section><section class="card"><div class="cardhead"><h2>Hoạt động gần đây</h2></div><div class="cardbody list">${activityList(5)}</div></section></div>
  <details class="card sec"><summary style="padding:13px 16px;cursor:pointer;font-weight:600">Định nghĩa chỉ số & bảng số liệu</summary><div class="cardbody"><p class="help">Kế hoạch đăng dùng ngày dự kiến; loại các bài nhập lịch sử chưa có lịch dự kiến; đã xuất bản dùng ngày đăng thực tế. Nội dung mới dùng ngày tạo; đã duyệt dùng ngày duyệt đầu tiên. Bản ghi thiếu mốc thời gian không được gán ngày giả. Đây không phải dữ liệu analytics từ mạng xã hội.</p><p class="help">Thiếu ngày tạo: ${db.content.filter(c=>!parseVN(c.createdAt)).length} nội dung. Đã duyệt nhưng thiếu ngày duyệt: ${db.content.filter(c=>c.status==='Đã duyệt'&&!parseVN(c.approvedAt)).length}. Đã đăng nhưng thiếu giờ thực tế: ${db.publications.filter(p=>p.status==='Đã đăng'&&!parseVN(p.posted)).length}.</p><div class="tablewrap"><table><thead><tr><th>Tuần bắt đầu</th><th>Đã xuất bản</th><th>Kế hoạch đăng</th><th>Nội dung mới</th><th>Duyệt đầu tiên</th></tr></thead><tbody>${d.days.map((v,i)=>`<tr><td>${fmt(v)}</td>${defs.map(([k])=>`<td>${d.measures[k].values[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></details>`}
function csvDownload(rows,name){let csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reportCSV(){let d=reportData();csvDownload([['Tuần bắt đầu','Đã xuất bản','Kế hoạch đăng','Nội dung mới','Duyệt đầu tiên'],...d.days.map((v,i)=>[v,...['posted','planned','opened','approved'].map(k=>d.measures[k].values[i])])],'handong-report-'+d.today+'.csv');notify('Đã xuất báo cáo CSV')}
function planCSV(){const cs=filteredContent();csvDownload([['Tiêu đề','Campaign','Giai đoạn','Trạng thái','Phụ trách','Địa điểm','Ngày quay','Ngày dựng','Hạn hoàn thành','Quá hạn','Checklist','Lịch đăng','Đã đăng','Ưu tiên','Tuyến nội dung','Link Drive'],...cs.map(c=>{const r=readiness(c),p=contentPubs(c.id);return [c.title,campname(c.campaign),phaseOf(c),c.status,c.owner,c.location,c.shoot,c.edit,c.due,overdue(c)?'Có':'',r.done+'/'+r.total,p.total,p.posted,c.priority,c.pillar,c.drive]})],'handong-ke-hoach-'+localDate()+'.csv');notify('Đã xuất '+cs.length+' nội dung (theo bộ lọc hiện tại). Mở Google Sheets → Tệp → Nhập để dùng.')}

/* ===== 8. GOOGLE SHEET & DRIVE ===== */
function sheetURL(){const u=safeURL(ui().sheetApi);return /^https:\/\/script\.google\.com\//.test(u)?u:''}
function sheetData(){const d={};for(const t of TABLES)d[t]=db[t].map(o=>{const x={...o};if(typeof x.thumb==='string'&&x.thumb.startsWith('data:')&&x.thumb.length>45000)x.thumb='';return x});return d}
async function pushSheet(silent){const url=sheetURL();if(!url){notify('Chưa có URL Apps Script. Vào Cài đặt & kết nối để thiết lập.');return}
  const body=JSON.stringify({action:'push',sentAt:new Date().toISOString(),data:sheetData()}),opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body};let confirmed=false;
  if(!silent)notify('Đang đẩy dữ liệu lên Google Sheet…');
  try{const r=await fetch(url,opt),j=await r.json();if(!j.ok)throw Object.assign(Error(j.error||'Sheet từ chối'),{fromSheet:true});confirmed=true}
  catch(e){if(e.fromSheet){notify('Google Sheet báo lỗi: '+e.message);return}
    try{await fetch(url,{...opt,mode:'no-cors'})}catch(e2){notify('Không gửi được lên Google Sheet. Kiểm tra mạng và URL Apps Script.');return}}
  db.ui={...ui(),lastPush:new Date().toISOString(),lastPushConfirmed:confirmed};try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}
  if(!silent||!confirmed)notify(confirmed?'Đã đẩy lên Google Sheet: '+TABLES.map(t=>db[t].length).join(' / ')+' dòng (campaign / nội dung / thành phẩm / lịch đăng)':'Đã gửi lên Google Sheet nhưng trình duyệt không đọc được phản hồi. Hãy mở Sheet để kiểm tra.');
  renderFooter();if(page==='settings')render()}
function fromSheetRows(data){const x={version:1,demo:false,activity:db.activity,ui:db.ui};
  for(const t of TABLES)x[t]=(Array.isArray(data?.[t])?data[t]:[]).map(r=>{const o={};for(const k in r)if(r[k]!=='')o[k]=r[k];return o});
  x.content.forEach(c=>{let ch;try{ch=JSON.parse(c.checks)}catch{ch=String(c.checks||'').split(/[,|]/).map(v=>/^(1|true|x)$/i.test(v.trim()))}c.checks=Array.from({length:6},(_,i)=>!!(Array.isArray(ch)&&ch[i]));c.title=c.title||''});
  x.media.forEach(m=>{m.title=m.title||'';const old=db.media.find(o=>o.id===m.id);if(!m.thumb&&old?.thumb?.startsWith('data:'))m.thumb=old.thumb});
  x.publications.forEach(p=>{if(!p.asset)delete p.asset});return x}
async function pullSheet(){const url=sheetURL();if(!url){notify('Chưa có URL Apps Script. Vào Cài đặt & kết nối để thiết lập.');return}
  notify('Đang đọc Google Sheet…');let j;
  try{const r=await fetch(url);j=await r.json()}catch(e){notify('Không đọc được Google Sheet. Kiểm tra URL và quyền truy cập “Bất kỳ ai” của Web App.');return}
  try{if(!j.ok)throw Error(j.error||'Phản hồi không hợp lệ');const x=fromSheetRows(j.data);validate(x);
    const n=t=>x[t].length+' (hiện có '+db[t].length+')';
    if(!x.content.length&&db.content.length){notify('Sheet đang trống nên không kéo về, để tránh xóa dữ liệu hiện có. Hãy “Đẩy lên Sheet” trước.');return}
    if(!confirm('Thay dữ liệu trên máy bằng dữ liệu từ Google Sheet?\n\nCampaign: '+n('campaigns')+'\nNội dung: '+n('content')+'\nThành phẩm: '+n('media')+'\nLịch đăng: '+n('publications')+'\n\nBản hiện tại được giữ làm bản khôi phục.'))return;
    keepBackup();db=x;db.ui={...ui(),lastPull:new Date().toISOString()};log('Kéo dữ liệu từ Google Sheet');storageError='';overwriteOK=true;save('Đã cập nhật từ Google Sheet');render()}
  catch(e){notify('Dữ liệu trên Sheet chưa hợp lệ, không thay đổi gì: '+e.message)}}
function restoreBackup(){let b;try{b=JSON.parse(localStorage.getItem(BACKUP))}catch{}if(!b?.db){notify('Không có bản khôi phục.');return}try{validate(b.db)}catch(e){notify('Bản khôi phục không hợp lệ.');return}if(confirm('Khôi phục dữ liệu trước lần nhập/kéo gần nhất ('+fmt(b.at,true)+')? Dữ liệu hiện tại sẽ bị thay.')){const cur=db;db=b.db;try{localStorage.setItem(BACKUP,JSON.stringify({at:new Date().toISOString(),db:cur}))}catch{}overwriteOK=true;storageError='';save('Đã khôi phục');render()}}
function settingsPage(){const u=ui();let bk;try{bk=JSON.parse(localStorage.getItem(BACKUP))}catch{}
  return head('Cài đặt & kết nối','Kết nối Google Sheet và Drive, sao lưu dữ liệu, đổi tên hiển thị.')+
  `<section class="card" style="margin-bottom:14px"><div class="cardhead"><div><h2>Google Sheet & Google Drive</h2><p class="small">${sheetURL()?`Đã cấu hình · đẩy gần nhất: ${u.lastPush?fmt(u.lastPush,true)+(u.lastPushConfirmed?'':' (chưa xác nhận)'):'chưa'} · kéo gần nhất: ${u.lastPull?fmt(u.lastPull,true):'chưa'}`:'Chưa kết nối Google Sheet'}</p></div><span class="tag ${sheetURL()?'green':'orange'}">${sheetURL()?'Đã cấu hình':'Chưa kết nối'}</span></div><div class="cardbody">
    <div class="settingsfields"><label class="field">URL Web App của Apps Script<input id="cfgApi" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(u.sheetApi||'')}"></label><label class="field">Link file Google Sheet (để mở nhanh)<input id="cfgSheet" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" value="${esc(u.sheetLink||'')}"></label><label class="field">Link thư mục Google Drive chứa thành phẩm<input id="cfgDrive" type="url" placeholder="https://drive.google.com/drive/folders/…" value="${esc(u.driveRoot||'')}"></label></div>
    <label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:12px"><input type="checkbox" id="cfgAuto" ${u.autoPush?'checked':''} style="width:auto"> Tự đẩy lên Sheet sau mỗi lần lưu (ghi đè toàn bộ 4 tab trên Sheet)</label>
    <div class="headactions"><button class="primary" id="saveConn">Lưu kết nối</button><button id="pushSheet">↑ Đẩy lên Sheet</button><button id="pullSheet">↓ Kéo từ Sheet</button>${safeURL(u.sheetLink)?`<a href="${esc(safeURL(u.sheetLink))}" target="_blank" rel="noopener noreferrer"><button type="button">Mở Sheet ↗</button></a>`:''}${safeURL(u.driveRoot)?`<a href="${esc(safeURL(u.driveRoot))}" target="_blank" rel="noopener noreferrer"><button type="button">Mở Drive ↗</button></a>`:''}</div>
    <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Cách kết nối Google Sheet (làm một lần, khoảng 3 phút)</summary><ol class="steps help"><li>Tạo một file Google Sheet mới (ví dụ “Handong Content Hub”).</li><li>Trong Sheet: <b>Tiện ích mở rộng → Apps Script</b>, xóa mã mẫu, dán đoạn mã bên dưới, bấm Lưu.</li><li><b>Triển khai → Tùy chọn triển khai mới → Ứng dụng web</b>. Thực thi với tư cách: <b>Tôi</b>. Người có quyền truy cập: <b>Bất kỳ ai</b>. Bấm Triển khai và cấp quyền.</li><li>Sao chép <b>URL ứng dụng web</b> (kết thúc bằng /exec), dán vào ô đầu tiên ở trên, bấm <b>Lưu kết nối</b> rồi <b>Đẩy lên Sheet</b>.</li></ol><textarea class="code" id="gasBox" readonly></textarea><div style="margin-top:8px"><button id="copyGas">Sao chép mã Apps Script</button></div><p class="note">Sheet sẽ có 4 tab: campaigns, content, media, publications. Mỗi lần đẩy ghi đè toàn bộ 4 tab; mỗi lần kéo thay toàn bộ dữ liệu trên máy (sau khi xác nhận, có bản khôi phục). Có thể sửa trực tiếp trên Sheet rồi kéo về, nhưng giữ nguyên cột <b>id</b> và tên trạng thái. Ai có URL Web App đều đọc/ghi được Sheet này, nên chỉ chia sẻ URL trong nhóm.</p></details>
    <p class="note"><b>Google Drive:</b> dán link tệp Drive vào thành phẩm để mở nhanh và tự lấy ảnh bìa; dán link thư mục Drive vào nội dung/campaign. Tệp cần bật chia sẻ “Bất kỳ ai có đường liên kết” thì ảnh bìa mới hiện. Ứng dụng không tự quét thư mục Drive.</p></div></section>
  <div class="two"><section class="card"><div class="cardhead"><h2>Sao lưu & dữ liệu</h2></div><div class="cardbody"><p class="help">Dữ liệu lưu trong <strong>trình duyệt này</strong> (localStorage). Mở ở máy/trình duyệt khác sẽ không tự có dữ liệu, trừ khi kéo từ Google Sheet hoặc nhập JSON.</p><div class="headactions" style="margin:12px 0"><button class="primary" id="export">↓ Xuất JSON</button><button id="import">↑ Nhập JSON</button><button id="exportPlanCSV">↓ CSV kế hoạch</button>${bk?.db?`<button id="restore">↺ Khôi phục bản ${fmt(bk.at,true)}</button>`:''}</div><div class="notice" style="margin:0 0 12px">Nhập JSON hoặc kéo từ Sheet sẽ thay toàn bộ dữ liệu sau khi xác nhận; bản trước đó được giữ lại để khôi phục.</div><div class="headactions"><button id="demo">Nạp lại DEMO</button><button class="danger" id="clear">Xóa dữ liệu, bắt đầu mới</button></div></div></section>

function setStatus(c,status){const old=c.status;if(old===status)return;c.status=status;c.updatedAt=new Date().toISOString();if(status==='Đã duyệt'&&!c.approvedAt)c.approvedAt=c.updatedAt;log(`${c.title}: ${old} → ${status}`,'content',c.id);save('Đã chuyển sang “'+status+'”');render()}
